name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Rule tests run on Node: oxlint's RuleTester refuses Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: bun install --frozen-lockfile

      - run: bun run check

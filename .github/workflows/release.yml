# Publishes to npm when a vX.Y.Z tag is pushed, via npm trusted publishing (OIDC): no npm token.
# Needs this repo and workflow registered as a trusted publisher on the package's npmjs.com settings.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # OIDC token for npm trusted publishing and provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Trusted publishing needs npm 11.5.1 or later, which current LTS Node ships.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - run: bun run check

      - run: npm publish
